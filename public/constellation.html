<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <link rel="icon" href="/app-icon.png">
  <title>283 剧情星图与伏笔关系网 · 闪耀色彩</title>
  <link rel="stylesheet" href="/fonts.css">
  <script src="/interface-font-core.js"></script>
  <script src="/interface-font.js"></script>
  <link rel="stylesheet" href="/navigation.css">
  <link rel="stylesheet" href="/constellation.css">
  <script src="/navigation.js"></script>
</head>
<body class="page-constellation">
  <canvas id="constellationCanvas" aria-label="283 剧情星图画布"></canvas>

  <!-- Floating Top HUD Stack (prevents header/motif overlap at any width) -->
  <div class="cn-hud-stack">
    <header class="cn-hud-top">
      <div class="cn-brand">
        <a href="guide.html" class="cn-back-btn" id="cnBackBtn">← 返回剧情馆</a>
        <div class="cn-title-block">
          <small>283 PRODUCTION · STORY CONSTELLATION</small>
          <h1>283 剧情星图与伏笔关系网</h1>
        </div>
      </div>

      <div class="cn-controls">
        <div class="cn-search-box">
          <input type="search" id="cnKeywordInput" placeholder="搜索核心人物或主线（如 七草叶月、八云、社长、W.I.N.G.、S.T.E.P.）…" aria-label="搜索核心人物或主线">
          <button type="button" id="cnSearchBtn">星图检索</button>
        </div>
        <div class="cn-view-btns">
          <button type="button" id="cnResetView" title="重置星图视角">◎ 全景重置</button>
          <button type="button" id="cnAutoOrbit" class="active" title="开启或暂停星系缓速自转">✦ 星系公转：开</button>
        </div>
      </div>
    </header>

    <!-- Core Story Figures & Major Arc Chips Bar -->
    <nav class="cn-motif-bar" id="cnMotifBar" aria-label="核心剧情人物与主线篇章">
      <span class="cn-motif-label">萌新导览与核心</span>
      <button type="button" class="cn-motif-chip" data-route="halloffame">🏆 社区神回好评榜</button>
      <button type="button" class="cn-motif-chip" data-route="roadmap">📖 必看防剧透路线</button>
      <button type="button" class="cn-motif-chip" data-node="制作人">👑 制作人 (全员)</button>
      <button type="button" class="cn-motif-chip" data-node="七草叶月">📋 七草叶月</button>
      <button type="button" class="cn-motif-chip" data-node="天井努 社长">🏛 天井努 社长</button>
      <button type="button" class="cn-motif-chip" data-node="八云奈美">🥀 八云奈美</button>
      <button type="button" class="cn-motif-chip" data-node="路加前经纪人">🎧 路加前经纪人</button>
      <button type="button" class="cn-motif-chip" data-node="七草父">🕯 七草父</button>
      <button type="button" class="cn-motif-chip" data-motif="W.I.N.G.">🏆 W.I.N.G.</button>
      <button type="button" class="cn-motif-chip" data-motif="G.R.A.D.">🎓 G.R.A.D.</button>
      <button type="button" class="cn-motif-chip" data-motif="感谢祭">🌠 感谢祭</button>
      <button type="button" class="cn-motif-chip" data-motif="L.P.">💿 L.P.</button>
      <button type="button" class="cn-motif-chip" data-motif="S.T.E.P.">👣 S.T.E.P.</button>
      <button type="button" class="cn-motif-chip" data-motif="越境">🔀 越境剧情</button>
      <button type="button" class="cn-motif-chip" data-motif="周年">🎉 周年 / 活动</button>
    </nav>
  </div>

  <!-- Unit Legend Bar (Bottom Left) -->
  <div class="cn-unit-legend" id="cnUnitLegend" aria-label="组合星群筛选"></div>

  <!-- Right Inspector Drawer -->
  <aside class="cn-inspector" id="cnInspector" aria-label="星图节点详情">
    <div class="cn-inspector-head">
      <div class="cn-insp-avatar" id="cnInspAvatar">✦</div>
      <div class="cn-insp-meta">
        <small id="cnInspSub">点击任意星辰或伏笔意象开始探索</small>
        <h2 id="cnInspTitle">283 全员星系总览</h2>
      </div>
      <button type="button" class="cn-insp-close" id="cnInspClose" title="收起详情">×</button>
    </div>
    <div class="cn-insp-stats" id="cnInspStats"></div>
    <div class="cn-insp-bonds" id="cnInspBonds"></div>
    <div class="cn-insp-stories" id="cnInspStories"></div>
  </aside>

  <!-- Subtle Hint & Line Color Legend -->
  <div class="cn-hint-bar">🟡 金线：制作人/核心羁绊 · 🟠 彩色线：同组伙伴 · 🔵 蓝线：跨组共同剧情 · 滚轮缩放 / 拖拽漫游</div>

  <script src="/constellation.js"></script>
</body>
</html>
