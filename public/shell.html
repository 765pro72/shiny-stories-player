  <script>
    (() => {
      const r = document.documentElement;
      if (window.desktop?.windowControlsOverlay) r.dataset.desktopChrome = 'overlay';
      // Stamp mobile / Android / Huawei HarmonyOS / Kirin / JoyTrans flags SYNCHRONOUSLY before first paint!
      try {
        const ua = navigator.userAgent || '';
        const isAnd = /ShinyStoriesAndroid|Android/i.test(ua) || typeof window.ShinyAndroid !== 'undefined';
        const isJt = /JoyTrans|Droitong|HarmonyOS|HUAWEI|HONOR/i.test(ua);
        const isHm = /HarmonyOS|OHOS/i.test(ua);
        const isKr = /KirinSoC|Kirin|HiSilicon|Maleoon/i.test(ua);
        const isMob = isAnd || isJt || isHm || isKr || /iPhone|iPad|iPod|Mobile/i.test(ua);
        if (isMob) r.dataset.mobile = '1';
        if (isAnd) r.dataset.android = '1';
        if (isJt) r.dataset.joytrans = '1';
        if (isHm) r.dataset.harmony = '1';
        if (isKr) r.dataset.kirin = '1';
      } catch {}
      // Hydrate & continuously mirror all `shiny.*` localStorage preferences into native persistent state
      // (survives app restarts & port changes on both Windows Electron and Android/HarmonyOS!)
      try {
        const readNative = () => {
          if (window.desktop?.getState) return window.desktop.getState() || {};
          if (window.ShinyAndroid?.getState) return JSON.parse(window.ShinyAndroid.getState() || '{}');
          return null;
        };
        const writeNative = (patch) => {
          if (!patch || !Object.keys(patch).length) return;
          if (window.desktop?.saveState) { window.desktop.saveState(patch); return; }
          if (window.ShinyAndroid?.saveState) { window.ShinyAndroid.saveState(JSON.stringify(patch)); }
        };
        const savedNative = readNative();
        if (savedNative && typeof savedNative === 'object') {
          for (const [k, v] of Object.entries(savedNative)) {
            if (k.startsWith('shiny.') && typeof v === 'string' && localStorage.getItem(k) === null) {
              localStorage.setItem(k, v);
            }
          }
        }
        if (!window.__shinyPrefsBridgeInstalled && (window.desktop?.saveState || window.ShinyAndroid?.saveState)) {
          window.__shinyPrefsBridgeInstalled = true;
          let pending = {};
          let flushTimer = 0;
          const flush = () => {
            clearTimeout(flushTimer);
            flushTimer = 0;
            const out = pending;
            pending = {};
            try { writeNative(out); } catch {}
          };
          const queueMirror = (k, v) => {
            if (typeof k !== 'string' || !k.startsWith('shiny.')) return;
            if (typeof v === 'string' && v.length > 500000) return;
            pending[k] = v;
            clearTimeout(flushTimer);
            flushTimer = setTimeout(flush, 120);
          };
          const origSet = Storage.prototype.setItem;
          const origRem = Storage.prototype.removeItem;
          Storage.prototype.setItem = function (k, v) {
            const res = origSet.call(this, k, v);
            if (this === window.localStorage) queueMirror(String(k), String(v));
            return res;
          };
          Storage.prototype.removeItem = function (k) {
            const res = origRem.call(this, k);
            if (this === window.localStorage) queueMirror(String(k), null);
            return res;
          };
          window.addEventListener('pagehide', flush);
          window.addEventListener('beforeunload', flush);
          window.__shinyFlushPrefs = flush;
          window.__shinyMirrorPref = queueMirror;
        }
      } catch {}
      try {
        const autoSun = localStorage.getItem('shiny.autoTheme') !== '0';
        const t = localStorage.getItem('shiny.theme');
        if (autoSun) {
          const now = new Date();
          const doy = Math.floor((now - new Date(now.getFullYear(), 0, 0)) / 86400000);
          const tz = -now.getTimezoneOffset() / 60;
          const lat = 35.0, lon = tz * 15 - 4, rad = Math.PI / 180;
          const g = (2 * Math.PI / 365) * (doy - 1);
          const eq = 229.18 * (0.000075 + 0.001868 * Math.cos(g) - 0.032077 * Math.sin(g) - 0.014615 * Math.cos(2 * g) - 0.040849 * Math.sin(2 * g));
          const dec = 0.006918 - 0.399912 * Math.cos(g) + 0.070257 * Math.sin(g) - 0.006758 * Math.cos(2 * g) + 0.000907 * Math.sin(2 * g) - 0.002697 * Math.cos(3 * g) + 0.00148 * Math.sin(3 * g);
          const ha = Math.acos(Math.max(-1, Math.min(1, (Math.cos(90.833 * rad) / (Math.cos(lat * rad) * Math.cos(dec))) - Math.tan(lat * rad) * Math.tan(dec)))) / rad;
          const sr = Math.round(720 - 4 * (lon + ha) - eq + tz * 60);
          const ss = Math.round(720 - 4 * (lon - ha) - eq + tz * 60);
          const nm = now.getHours() * 60 + now.getMinutes();
          const isDay = nm >= sr && nm < ss;
          const slot = `${now.getFullYear()}-${now.getMonth() + 1}-${now.getDate()}:${isDay ? 'day' : 'night'}`;
          if (localStorage.getItem('shiny.themeManualSlot') === slot && (t === 'dark' || t === 'light')) r.dataset.theme = t;
          else r.dataset.theme = isDay ? 'light' : 'dark';
        } else if (t === 'dark' || t === 'light') {
          r.dataset.theme = t;
        }
        const fx = localStorage.getItem('shiny.stageFxMode');
        r.dataset.stageFx = fx === 'soft' ? 'soft' : 'full';
      } catch {}
    })();
  </script>

              <button class="ip-vol-btn" id="ipMuteBtn" type="button" data-tip="静音 / 取消静音" aria-label="静音切换">
                <svg class="ic-vol-on" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                <svg class="ic-vol-off" viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
              </button>
              <input type="range" id="ipVolume" min="0" max="100" step="1" value="50" aria-label="音乐胶囊音量">
              <span class="ip-vol-val" id="ipVolText">50%</span>
            </div>
          </div>
          <div class="ip-audio-tuning" id="ipAudioTuning" hidden aria-label="音质与音效调节">
            <label class="ip-tune-field">
              <span>音质</span>
              <select id="ipQualitySelect" aria-label="切换音质">
                <option value="jymaster">超清母带 (母带)</option>
                <option value="sky">沉浸环绕声 (环绕声)</option>
                <option value="jyeffect">臻音全景声 (全景声)</option>
                <option value="hires">高清臻音 (臻音)</option>
                <option value="flac">无损 SQ</option>
                <option value="320">极高 HQ</option>
                <option value="128">标准</option>
              </select>
            </label>
            <label class="ip-tune-field">
              <span>音效</span>
              <select id="ipFxSelect" aria-label="切换音效">
                <option value="off">原声直出 (关闭音效)</option>
                <option value="ai_master">✨ AI调音大师</option>
                <option value="surround_51">沉浸环绕 5.1</option>
                <option value="surround_8d">8D 环绕</option>
                <option value="surround_360">360° 环绕</option>
                <option value="vocal_clear">清澈人声</option>
                <option value="megabass">超重低音</option>
                <option value="live283">283 Live 现场</option>
              </select>
            </label>
          </div>
          <div class="ip-queue-section" id="ipQueueSection" hidden>
            <div class="ip-queue-head">
              <span id="ipQueueTitle">待播列表</span>
              <button type="button" class="ip-queue-toggle" id="ipQueueToggle">收起</button>
            </div>
            <div class="ip-queue-list" id="ipQueueList"></div>
          </div>
        </div>
      </div>

      <!-- Icon-Only Glass Utility Cluster -->
      <div class="shell-utils">
        <button class="util-btn util-companion" id="btnCompanion" type="button" data-tip="透明桌面伙伴 · 语音模型接入" aria-label="开启或关闭透明桌面伙伴">
          <svg viewBox="0 0 24 24"><path d="M12 3.2c-3.9 0-7 2.8-7 6.4 0 2.3 1.2 4.3 3.1 5.4L7.4 19l3.7-1.6c.3.05.6.08.9.08 3.9 0 7-2.8 7-6.4 0-3.6-3.1-6.4-7-6.4z"/><circle cx="9.6" cy="9.6" r="1"/><circle cx="14.4" cy="9.6" r="1"/></svg>
        </button>
        <button class="util-btn util-stage-fx is-on" id="btnStageFx" type="button" data-tip="舞台灯光秀：全力拉满（点击切换柔光）" aria-label="切换舞台灯光秀强度">
          <svg viewBox="0 0 24 24"><path d="M12 2.2l2.1 6.2 6.2 2.1-6.2 2.1-2.1 6.2-2.1-6.2-6.2-2.1 6.2-2.1z"/></svg>
        </button>
        <button class="util-btn" id="btnSpotlight" type="button" data-tip="全局检索  Ctrl+K" aria-label="全局检索">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
        </button>
        <button class="util-btn" id="btnTheme" type="button" data-tip="切换明暗氛围" aria-label="切换明暗氛围">
          <svg class="ic-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.9 19.1l1.6-1.6M17.5 6.5l1.6-1.6"/></svg>
          <svg class="ic-moon" viewBox="0 0 24 24"><path d="M20.4 14.6A8.5 8.5 0 0 1 9.4 3.6a8.5 8.5 0 1 0 11 11z"/></svg>
        </button>
        <button class="util-btn util-continue" id="btnContinue" type="button" data-tip="继续阅读" aria-label="继续阅读">
          <svg viewBox="0 0 24 24"><path d="M8.5 6.2v11.6a.9.9 0 0 0 1.38.76l9.1-5.8a.9.9 0 0 0 0-1.52l-9.1-5.8A.9.9 0 0 0 8.5 6.2z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Cinema Prism Concert Light-Sweep Curtain Wipe Between Stage Modules -->
  <div class="stage-prism-wipe" id="stagePrismWipe" aria-hidden="true"></div>

  <!-- Persistent Spatial Stage (Keep-Alive Module Frame Pool) -->
  <main class="shell-stage" id="shellStage"></main>

  <!-- Apple macOS Spotlight Command Palette (Ctrl+K) -->
  <div class="spotlight-backdrop" id="spotlightBackdrop" hidden>
    <div class="spotlight-modal" id="spotlightModal" role="dialog" aria-modal="true" aria-label="全局快速检索">
      <div class="spotlight-input-row">
        <svg class="sp-search-ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.8"/><path d="M20.5 20.5l-4.4-4.4"/></svg>
        <input type="text" id="spotlightInput" placeholder="搜索偶像、曲目、模块或操作…" autocomplete="off" spellcheck="false">
        <kbd class="sp-kbd">ESC</kbd>
      </div>
      <div class="spotlight-body" id="spotlightResults"></div>
      <div class="spotlight-foot">
        <span><kbd>↑</kbd><kbd>↓</kbd> 选择</span>
        <span><kbd>↵</kbd> 直达</span>
        <span><kbd>Alt</kbd>+<kbd>1–7</kbd> 切换模块</span>
      </div>
    </div>
  </div>

  <!-- Crisp Apple Floating Tooltip -->
  <div class="shell-tip" id="shellTip" role="tooltip"></div>
</body>
</html>
