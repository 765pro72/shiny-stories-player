<!doctype html><html lang="zh-CN"><head><script src="/interface-font-core.js"></script><script src="/interface-font.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>信件与纪念品</title><link rel="stylesheet" href="/fonts.css"><link rel="stylesheet" href="voice-gallery.css"><link rel="stylesheet" href="interface.css"><link rel="stylesheet" href="navigation.css"><link rel="stylesheet" href="liquid-glass.css"><link rel="stylesheet" href="layout-refinements.css"><link rel="stylesheet" href="apple-reset.css"><script src="navigation.js"></script><script src="interface.js" defer></script><script src="liquid-glass.js" defer></script><link rel="stylesheet" href="update-ui.css"><script src="update-ui.js" defer></script></head><body class="page-memorial"><div class="window-drag-handle" aria-hidden="true"></div><header class="site-header"><a href="index.html" class="site-brand"><b>283</b><span>闪耀色彩<small>STORIES &amp; MEMORIES</small></span></a><div class="header-drag-space" aria-hidden="true"></div><nav class="site-nav" aria-label="模块导航"><a href="index.html">事务所</a><a href="guide.html">剧情馆</a><a href="card-gallery.html">卡片相册</a><a href="voice-gallery.html">语音馆</a><a href="model-picker.html">衣装室</a><a href="custom-story.html">怪文书</a><a data-continue-reading class="nav-continue" href="guide.html?mode=recent#archive">继续阅读</a></nav></header><main><h1>信件与纪念品</h1><p><a href="voice-gallery.html?kind=信件语音">▶ 有声信件 · 原声与动态偶像试听</a></p><p>官方资源索引中的信件与纪念品。尚未取得原图的条目明确标为待补，不计为已收录。</p><div class="filters"><select id="type" aria-label="类型"><option value="letter">信件</option><option value="icon">纪念品</option></select><input id="q" type="search" placeholder="搜索资源编号" aria-label="搜索资源编号"></div><p id="status"></p><section id="list"></section></main><script>fetch('/data/memorial-index.json').then(r=>r.json()).then(rows=>{const $=s=>document.querySelector(s);function draw(){const filtered=rows.filter(r=>r.type===$('#type').value&&r.id.includes($('#q').value));$('#status').textContent='索引 '+filtered.length+' 项；已取得图片 '+filtered.filter(r=>r.available).length+' 项。';$('#list').replaceChildren(...filtered.map(r=>{const a=document.createElement(r.available?'a':'article');a.className='voice';if(r.available){a.href='/asset/'+r.key;a.target='_blank';const img=document.createElement('img');img.src=a.href;img.loading='lazy';img.alt=r.id;img.style.width='100%';a.append(img)}const title=document.createElement('strong'),note=document.createElement('small');title.textContent=(r.type==='letter'?'信件':'纪念品')+' · '+r.id;note.textContent=r.available?'查看原图':'图片与名称待补；不代表已取得';a.append(title,note);return a}))}for(const id of ['type','q'])$('#'+id).addEventListener(id==='q'?'input':'change',draw);draw()}).catch(()=>document.querySelector('#status').textContent='索引加载失败')</script></body></html>
